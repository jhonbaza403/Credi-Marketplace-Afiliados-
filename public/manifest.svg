<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Credi Marketplace Web App Manifest</title>
  <desc id="desc">Vector overview of the PWA manifest identity, scope, theme and icons.</desc>
  <rect width="1200" height="520" fill="#f8fafc"/>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="600" y="65" font-size="28" font-weight="700" fill="#0f172a">Credi Marketplace — Web App Manifest</text>
    <text x="600" y="95" font-size="15" fill="#475569">Identidad PWA · alcance · tema · iconografía</text>
    <rect x="80" y="155" width="230" height="250" rx="18" fill="#fff" stroke="#0f172a" stroke-width="2"/>
    <text x="195" y="205" font-size="21" font-weight="700" fill="#0f172a">Identity</text>
    <text x="195" y="240" font-size="15" fill="#475569">Credi Marketplace</text>
    <text x="195" y="267" font-size="15" fill="#475569">short_name: Credi</text>
    <text x="195" y="294" font-size="15" fill="#475569">lang: es</text>
    <text x="195" y="321" font-size="15" fill="#475569">dir: ltr</text>
    <rect x="350" y="155" width="230" height="250" rx="18" fill="#fff" stroke="#0f172a" stroke-width="2"/>
    <text x="465" y="205" font-size="21" font-weight="700" fill="#0f172a">Application</text>
    <text x="465" y="240" font-size="15" fill="#475569">start_url: /</text>
    <text x="465" y="267" font-size="15" fill="#475569">scope: /</text>
    <text x="465" y="294" font-size="15" fill="#475569">standalone</text>
    <text x="465" y="321" font-size="15" fill="#475569">portrait-primary</text>
    <rect x="620" y="155" width="230" height="250" rx="18" fill="#fff" stroke="#0f172a" stroke-width="2"/>
    <text x="735" y="205" font-size="21" font-weight="700" fill="#0f172a">Theme</text>
    <text x="735" y="240" font-size="15" fill="#475569">background: #ffffff</text>
    <text x="735" y="267" font-size="15" fill="#475569">theme: #0f172a</text>
    <text x="735" y="294" font-size="15" fill="#475569">shopping</text>
    <text x="735" y="321" font-size="15" fill="#475569">business</text>
    <rect x="890" y="155" width="230" height="250" rx="18" fill="#fff" stroke="#0f172a" stroke-width="2"/>
    <text x="1005" y="205" font-size="21" font-weight="700" fill="#0f172a">Icons</text>
    <text x="1005" y="245" font-size="15" fill="#475569">192×192 PNG</text>
    <text x="1005" y="275" font-size="15" fill="#475569">512×512 PNG</text>
    <text x="1005" y="305" font-size="15" fill="#475569">maskable</text>
    <text x="600" y="465" font-size="14" fill="#475569">Fuente ejecutable: public/manifest.json</text>
  </g>
</svg>
