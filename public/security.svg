<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Credi Marketplace security disclosure</title>
  <desc id="desc">Vector overview of security reporting, canonical location, expiry and preferred languages.</desc>
  <rect width="1200" height="520" fill="#f8fafc"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="600" y="65" text-anchor="middle" font-size="28" font-weight="700" fill="#0f172a">Credi Marketplace — Security Disclosure</text>
    <text x="600" y="95" text-anchor="middle" font-size="15" fill="#475569">security.txt · divulgación responsable de vulnerabilidades</text>
    <rect x="80" y="150" width="320" height="250" rx="18" fill="#fff" stroke="#0f172a" stroke-width="2"/>
    <text x="240" y="200" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Contact</text>
    <text x="110" y="245" font-size="14" fill="#475569">GitHub Security Advisories</text>
    <text x="110" y="275" font-size="13" fill="#475569">/security/advisories/new</text>
    <text x="110" y="325" font-size="14" fill="#475569">Preferred languages:</text>
    <text x="110" y="352" font-size="15" fill="#475569">es, en</text>
    <rect x="440" y="150" width="320" height="250" rx="18" fill="#fff" stroke="#0f172a" stroke-width="2"/>
    <text x="600" y="200" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Lifecycle</text>
    <text x="470" y="245" font-size="15" fill="#475569">Expires: 2027-09-03 UTC</text>
    <text x="470" y="290" font-size="15" fill="#475569">Canonical:</text>
    <text x="470" y="318" font-size="13" fill="#475569">/.well-known/security.txt</text>
    <text x="470" y="365" font-size="14" fill="#475569">Review and renew before expiry.</text>
    <rect x="800" y="150" width="320" height="250" rx="18" fill="#fff" stroke="#0f172a" stroke-width="2"/>
    <text x="960" y="200" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Policy</text>
    <text x="830" y="245" font-size="15" fill="#475569">Report privately.</text>
    <text x="830" y="275" font-size="15" fill="#475569">Do not publish credentials,</text>
    <text x="830" y="302" font-size="15" fill="#475569">tokens or sensitive data.</text>
    <text x="830" y="345" font-size="15" fill="#475569">Technical details remain</text>
    <text x="830" y="372" font-size="15" fill="#475569">confidential until triage.</text>
  </g>
</svg>
