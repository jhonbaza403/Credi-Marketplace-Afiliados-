# Credi Marketplace — Supabase local configuration
# Keep this file aligned with the repository's local development/test contract.

project_id = "credi-marketplace"

[api]
enabled = true
port = 54321
schemas = ["public", "storage"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324
smtp_port = 54325
pop3_port = 54326

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = [
  "http://localhost:3000/**",
  "http://127.0.0.1:3000/**",
]

[analytics]
enabled = false

# Health is a public liveness endpoint and does not require a user JWT.
[functions.health]
verify_jwt = false
