<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">Credi Marketplace security defense in depth</title>
  <desc id="desc">Security controls protect the browser boundary, server, Supabase and PostgreSQL, dependencies and deployment pipeline.</desc>
  <rect width="1200" height="600" fill="#f8fafc"/>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="600" y="55" font-size="28" font-weight="700" fill="#0f172a">Credi Marketplace — Defensa en profundidad</text>

    <rect x="60" y="105" width="1080" height="100" rx="18" fill="#fff" stroke="#0f172a" stroke-width="2"/>
    <text x="600" y="145" font-size="22" fill="#0f172a">1 · Cliente</text>
    <text x="600" y="175" font-size="14" fill="#475569">Input no confiable · sin secretos · interacción mínima</text>

    <rect x="120" y="250" width="300" height="150" rx="18" fill="#fff" stroke="#0f172a" stroke-width="2"/>
    <text x="270" y="292" font-size="21" fill="#0f172a">2 · Next.js</text>
    <text x="270" y="321" font-size="14" fill="#475569">Auth / Authorization</text>
    <text x="270" y="345" font-size="14" fill="#475569">Validation</text>
    <text x="270" y="369" font-size="14" fill="#475569">Safe errors / no-store</text>

    <rect x="450" y="250" width="300" height="150" rx="18" fill="#fff" stroke="#0f172a" stroke-width="2"/>
    <text x="600" y="292" font-size="21" fill="#0f172a">3 · Supabase</text>
    <text x="600" y="321" font-size="14" fill="#475569">Auth</text>
    <text x="600" y="345" font-size="14" fill="#475569">RLS</text>
    <text x="600" y="369" font-size="14" fill="#475569">RPC / Storage</text>

    <rect x="780" y="250" width="300" height="150" rx="18" fill="#fff" stroke="#0f172a" stroke-width="2"/>
    <text x="930" y="292" font-size="21" fill="#0f172a">4 · PostgreSQL</text>
    <text x="930" y="321" font-size="14" fill="#475569">Constraints</text>
    <text x="930" y="345" font-size="14" fill="#475569">Transactions</text>
    <text x="930" y="369" font-size="14" fill="#475569">Atomic inventory</text>

    <rect x="180" y="465" width="300" height="80" rx="18" fill="#fff" stroke="#0f172a" stroke-width="2"/>
    <text x="330" y="500" font-size="19" fill="#0f172a">5 · Supply Chain</text>
    <text x="330" y="526" font-size="14" fill="#475569">Dependabot · npm audit · lockfile</text>

    <rect x="720" y="465" width="300" height="80" rx="18" fill="#fff" stroke="#0f172a" stroke-width="2"/>
    <text x="870" y="500" font-size="19" fill="#0f172a">6 · CI/CD</text>
    <text x="870" y="526" font-size="14" fill="#475569">CI · Security · Deployment Gate · Vercel</text>

    <g stroke="#334155" stroke-width="3" fill="none" marker-end="url(#arrow)">
      <path d="M600 205 V250"/>
      <path d="M420 325 H450"/>
      <path d="M750 325 H780"/>
      <path d="M330 400 V465"/>
      <path d="M870 400 V465"/>
    </g>
  </g>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
  </defs>
</svg>
