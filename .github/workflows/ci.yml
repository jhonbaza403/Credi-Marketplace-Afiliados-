name: Credi Marketplace CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Install → Lint → Typecheck → Unit → E2E → Build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Verify Node.js and npm
        run: |
          echo "Node: $(node --version)"
          echo "npm:  $(npm --version)"
          node -e "const major=Number(process.versions.node.split('.')[0]); if (major !== 22) { console.error('Expected Node.js 22.x'); process.exit(1); }"

      - name: Install dependencies from lockfile
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify dependency tree
        run: npm ls esbuild postcss sharp vite vitest --depth=10

      - name: Run Linter
        run: npm run lint

      - name: Run Typecheck
        run: npm run typecheck

      - name: Run Unit Tests
        run: npm run test

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E Tests
        run: npm run test:e2e

      - name: Build Project
        run: npm run build
