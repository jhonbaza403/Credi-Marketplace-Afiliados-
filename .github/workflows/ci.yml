name: Credi Marketplace CI

on:
push:
branches:
- main

pull_request:
branches:
- main

concurrency:
group: credi-marketplace-ci-${{ github.workflow }}-${{ github.ref }}
cancel-in-progress: true

permissions:
contents: read

env:
CI: "true"
NEXT_TELEMETRY_DISABLED: "1"
NODE_ENV: test

jobs:
quality:
name: Validate → Install → Lint → Typecheck → Unit → E2E → Build
runs-on: ubuntu-latest
timeout-minutes: 35

```
steps:
  # ==========================================================
  # CHECKOUT
  # ==========================================================

  - name: Checkout repository
    uses: actions/checkout@v4
    with:
      fetch-depth: 1

  # ==========================================================
  # NODE.JS 24
  # ==========================================================

  - name: Setup Node.js 24
    uses: actions/setup-node@v4
    with:
      node-version: "24"
      cache: npm
      cache-dependency-path: package-lock.json

  # ==========================================================
  # RUNTIME VALIDATION
  # ==========================================================

  - name: Verify Node.js and npm
    shell: bash
    run: |
      set -euo pipefail

      echo "=========================================="
      echo "Credi Marketplace CI - Runtime"
      echo "=========================================="

      NODE_VERSION="$(node --version)"
      NPM_VERSION="$(npm --version)"
      NODE_MAJOR="$(node -p "process.versions.node.split('.')[0]")"
      NPM_MAJOR="$(npm --version | cut -d. -f1)"

      echo "Node.js: ${NODE_VERSION}"
      echo "npm:     ${NPM_VERSION}"

      if [ "${NODE_MAJOR}" != "24" ]; then
        echo "::error::Expected Node.js 24.x but found ${NODE_VERSION}"
        exit 1
      fi

      if [ "${NPM_MAJOR}" != "11" ]; then
        echo "::error::Expected npm 11.x but found ${NPM_VERSION}"
        exit 1
      fi

      echo "Runtime validation: OK"

  # ==========================================================
  # REPOSITORY CONTRACT
  # ==========================================================

  - name: Validate repository contract
    shell: bash
    run: |
      set -euo pipefail

      required_files=(
        "package.json"
        "package-lock.json"
        ".nvmrc"
        "tsconfig.json"
        "next.config.ts"
        "eslint.config.mjs"
        "postcss.config.mjs"
      )

      for file in "${required_files[@]}"; do
        if [ ! -f "$file" ]; then
          echo "::error::Required file missing: $file"
          exit 1
        fi
      done

      echo "Required repository files: OK"

  # ==========================================================
  # VERIFY .NVMRC
  # ==========================================================

  - name: Verify .nvmrc
    shell: bash
    run: |
      set -euo pipefail

      NVM_VERSION="$(tr -d '[:space:]' < .nvmrc)"

      if [ "${NVM_VERSION}" != "24" ]; then
        echo "::error::.nvmrc must contain exactly: 24"
        echo "::error::Found: ${NVM_VERSION}"
        exit 1
      fi

      echo ".nvmrc validation: OK"

  # ==========================================================
  # VERIFY PACKAGE ENGINES
  # ==========================================================

  - name: Verify package.json engines
    shell: bash
    run: |
      set -euo pipefail

      node <<'NODE'
      const fs = require("node:fs");

      const packageJson = JSON.parse(
        fs.readFileSync("package.json", "utf8")
      );

      const engines = packageJson.engines;

      if (!engines?.node) {
        console.error("::error::package.json is missing engines.node");
        process.exit(1);
      }

      if (!engines?.npm) {
        console.error("::error::package.json is missing engines.npm");
        process.exit(1);
      }

      if (engines.node !== ">=24.0.0 <25.0.0") {
        console.error(
          `::error::Expected engines.node to be >=24.0.0 <25.0.0 but found ${engines.node}`
        );
        process.exit(1);
      }

      if (engines.npm !== ">=11.0.0 <12.0.0") {
        console.error(
          `::error::Expected engines.npm to be >=11.0.0 <12.0.0 but found ${engines.npm}`
        );
        process.exit(1);
      }

      console.log("package.json engines validation: OK");
      NODE

  # ==========================================================
  # LOCKFILE VALIDATION
  # ==========================================================

  - name: Validate package-lock.json
    shell: bash
    run: |
      set -euo pipefail

      test -f package-lock.json

      echo "Validating package-lock.json..."

      npm ci \
        --dry-run \
        --ignore-scripts \
        --no-audit \
        --no-fund

      echo "package-lock.json validation: OK"

  # ==========================================================
  # INSTALL
  # ==========================================================

  - name: Install dependencies
    shell: bash
    run: |
      set -euo pipefail

      npm ci \
        --ignore-scripts \
        --no-audit \
        --no-fund

  # ==========================================================
  # DEPENDENCY TREE
  # ==========================================================

  - name: Verify dependency tree
    shell: bash
    run: |
      set -euo pipefail

      echo "Checking critical dependency versions..."

      npm ls \
        esbuild \
        postcss \
        sharp \
        vite \
        vitest \
        --depth=10

  # ==========================================================
  # PROJECT STRUCTURE
  # ==========================================================

  - name: Verify project structure
    run: npm run verify:structure

  # ==========================================================
  # ESLINT
  # ==========================================================

  - name: Run ESLint
    run: npm run lint

  # ==========================================================
  # TYPESCRIPT
  # ==========================================================

  - name: Run TypeScript typecheck
    run: npm run typecheck

  # ==========================================================
  # UNIT TESTS
  # ==========================================================

  - name: Run unit tests
    run: npm run test

  # ==========================================================
  # PLAYWRIGHT
  # ==========================================================

  - name: Install Playwright Chromium
    run: npx playwright install --with-deps chromium

  - name: Run E2E tests
    run: npm run test:e2e

  # ==========================================================
  # PRODUCTION BUILD
  # ==========================================================

  - name: Build project
    run: npm run build

  # ==========================================================
  # SUCCESS SUMMARY
  # ==========================================================

  - name: CI success summary
    if: success()
    shell: bash
    run: |
      echo "=========================================="
      echo "Credi Marketplace CI: PASSED"
      echo "=========================================="
      echo "Node.js: $(node --version)"
      echo "npm:     $(npm --version)"
      echo ""
      echo "Validated:"
      echo "✓ Repository contract"
      echo "✓ .nvmrc"
      echo "✓ package.json engines"
      echo "✓ package-lock.json"
      echo "✓ npm dependency installation"
      echo "✓ Dependency tree"
      echo "✓ Project structure"
      echo "✓ ESLint"
      echo "✓ TypeScript"
      echo "✓ Unit tests"
      echo "✓ Playwright E2E"
      echo "✓ Production build"
      echo "=========================================="
