name: Credi Marketplace CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: credi-marketplace-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: "true"
  NEXT_TELEMETRY_DISABLED: "1"
  NODE_ENV: test

jobs:
  quality:
    name: Validate → Install → Lint → Typecheck → Unit → E2E → Build
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          check-latest: true
          package-manager-cache: false

      - name: Install exact npm version
        shell: bash
        run: |
          set -euo pipefail
          npm install --global npm@11.19.1
          hash -r

      - name: Verify Node.js and npm
        shell: bash
        run: |
          set -euo pipefail

          NODE_VERSION="$(node --version)"
          NPM_VERSION="$(npm --version)"
          NODE_MAJOR="$(node -p "process.versions.node.split('.')[0]")"
          NPM_MAJOR="$(npm --version | cut -d. -f1)"

          echo "Node.js: ${NODE_VERSION}"
          echo "npm:     ${NPM_VERSION}"

          if [ "${NODE_MAJOR}" != "24" ]; then
            echo "::error::Expected Node.js 24.x but found ${NODE_VERSION}"
            exit 1
          fi

          if [ "${NPM_MAJOR}" != "11" ]; then
            echo "::error::Expected npm 11.x but found ${NPM_VERSION}"
            exit 1
          fi

          if [ "${NPM_VERSION}" != "11.19.1" ]; then
            echo "::error::Expected npm 11.19.1 but found ${NPM_VERSION}"
            exit 1
          fi

      - name: Validate repository contract
        shell: bash
        run: |
          set -euo pipefail

          required_files=(
            "package.json"
            "package-lock.json"
            ".nvmrc"
            ".node-version"
            "tsconfig.json"
            "next.config.ts"
            "eslint.config.mjs"
            "postcss.config.mjs"
          )

          for file in "${required_files[@]}"; do
            test -f "$file" || {
              echo "::error::Required file missing: $file"
              exit 1
            }
          done

      - name: Validate runtime contract
        shell: bash
        run: |
          set -euo pipefail

          test "$(tr -d '[:space:]' < .nvmrc)" = "24"
          test "$(tr -d '[:space:]v' < .node-version)" = "24"

          node <<'NODE'
          const fs = require("node:fs");
          const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));

          const expected = {
            node: ">=24.0.0 <25.0.0",
            npm: ">=11.0.0 <12.0.0",
            packageManager: "npm@11.19.1",
          };

          if (pkg.packageManager !== expected.packageManager) {
            console.error(`::error::Expected packageManager=${expected.packageManager}; found ${pkg.packageManager ?? "missing"}`);
            process.exit(1);
          }

          if (pkg.engines?.node !== expected.node) {
            console.error(`::error::Invalid engines.node: ${pkg.engines?.node ?? "missing"}`);
            process.exit(1);
          }

          if (pkg.engines?.npm !== expected.npm) {
            console.error(`::error::Invalid engines.npm: ${pkg.engines?.npm ?? "missing"}`);
            process.exit(1);
          }
          NODE

      - name: Regenerate and validate npm lockfile
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          node <<'NODE'
          const fs = require("node:fs");
          const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
          const lock = JSON.parse(fs.readFileSync("package-lock.json", "utf8"));
          if (lock.lockfileVersion !== 3) throw new Error(`Expected lockfileVersion 3, got ${lock.lockfileVersion}`);
          if (lock.name !== pkg.name) throw new Error("package-lock.json name differs from package.json");
          if (lock.version !== pkg.version) throw new Error("package-lock.json version differs from package.json");
          if (!lock.packages || typeof lock.packages !== "object" || !lock.packages[""]) {
            throw new Error("package-lock.json does not contain the npm package tree");
          }
          console.log("package-lock.json structure: OK");
          NODE
          npm ci --dry-run --ignore-scripts --no-audit --no-fund

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify dependency tree
        run: npm ls esbuild postcss sharp vite vitest --depth=10

      - name: Verify project structure
        run: npm run verify:structure

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Run unit tests
        run: npm run test

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Build project
        run: npm run build

      - name: CI success summary
        if: success()
        shell: bash
        run: |
          echo "Credi Marketplace CI: PASSED"
          echo "Node.js: $(node --version)"
          echo "npm:     $(npm --version)"
