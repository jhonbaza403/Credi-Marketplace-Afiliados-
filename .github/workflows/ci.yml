name: Credi Marketplace CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

# Evita ejecutar varias CI simultáneas sobre el mismo branch/PR.
# Si llega un nuevo commit, cancela la ejecución anterior.
concurrency:
  group: credi-marketplace-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Mínimos permisos necesarios para este workflow.
permissions:
  contents: read

env:
  CI: true
  NEXT_TELEMETRY_DISABLED: "1"
  NODE_ENV: test

jobs:
  quality:
    name: Install → Validate → Lint → Typecheck → Unit → E2E → Build
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      # ==========================================================
      # 1. Checkout
      # ==========================================================
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # ==========================================================
      # 2. Node.js 22 + npm
      # ==========================================================
      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      # ==========================================================
      # 3. Verificar runtime real
      # ==========================================================
      - name: Verify Node.js and npm
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Credi Marketplace CI - Runtime"
          echo "=========================================="

          NODE_VERSION="$(node --version)"
          NPM_VERSION="$(npm --version)"
          NODE_MAJOR="$(node -p "process.versions.node.split('.')[0]")"
          NPM_MAJOR="$(npm --version | cut -d. -f1)"

          echo "Node.js: ${NODE_VERSION}"
          echo "npm:     ${NPM_VERSION}"

          if [ "${NODE_MAJOR}" != "22" ]; then
            echo "::error::Expected Node.js 22.x but found ${NODE_VERSION}"
            exit 1
          fi

          if [ "${NPM_MAJOR}" != "10" ]; then
            echo "::error::Expected npm 10.x but found ${NPM_VERSION}"
            exit 1
          fi

          echo "Runtime validation: OK"

      # ==========================================================
      # 4. Validar existencia de archivos críticos
      # ==========================================================
      - name: Validate repository contract
        shell: bash
        run: |
          set -euo pipefail

          required_files=(
            "package.json"
            "package-lock.json"
            "tsconfig.json"
            "next.config.ts"
            "eslint.config.mjs"
            "postcss.config.mjs"
          )

          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "::error::Required file missing: $file"
              exit 1
            fi
          done

          echo "Required repository files: OK"

      # ==========================================================
      # 5. Instalar EXACTAMENTE desde package-lock.json
      # ==========================================================
      - name: Install dependencies from lockfile
        run: npm ci --ignore-scripts --no-audit --no-fund

      # ==========================================================
      # 6. Verificar árbol de dependencias
      # ==========================================================
      - name: Verify dependency tree
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking critical dependency versions..."

          npm ls \
            esbuild \
            postcss \
            sharp \
            vite \
            vitest \
            --depth=10

      # ==========================================================
      # 7. Verificar que el lockfile está sincronizado
      # ==========================================================
      - name: Verify lockfile integrity
        shell: bash
        run: |
          set -euo pipefail

          npm ci --dry-run --ignore-scripts --no-audit --no-fund

          echo "package-lock.json is synchronized with package.json"

      # ==========================================================
      # 8. Validar estructura del proyecto
      # ==========================================================
      - name: Verify project structure
        run: npm run verify:structure

      # ==========================================================
      # 9. ESLint
      # ==========================================================
      - name: Run Linter
        run: npm run lint

      # ==========================================================
      # 10. TypeScript
      # ==========================================================
      - name: Run Typecheck
        run: npm run typecheck

      # ==========================================================
      # 11. Unit Tests
      # ==========================================================
      - name: Run Unit Tests
        run: npm run test

      # ==========================================================
      # 12. Playwright dependencies
      # ==========================================================
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # ==========================================================
      # 13. E2E Tests
      # ==========================================================
      - name: Run E2E Tests
        run: npm run test:e2e

      # ==========================================================
      # 14. Production Build
      # ==========================================================
      - name: Build Project
        run: npm run build

      # ==========================================================
      # 15. Final summary
      # ==========================================================
      - name: CI success summary
        if: success()
        shell: bash
        run: |
          echo "=========================================="
          echo "Credi Marketplace CI: PASSED"
          echo "=========================================="
          echo "Node.js: $(node --version)"
          echo "npm:     $(npm --version)"
          echo ""
          echo "Validated:"
          echo "✓ Repository contract"
          echo "✓ Lockfile integrity"
          echo "✓ Dependency tree"
          echo "✓ Project structure"
          echo "✓ ESLint"
          echo "✓ TypeScript"
          echo "✓ Unit tests"
          echo "✓ Playwright E2E"
          echo "✓ Production build"
          echo "=========================================="
