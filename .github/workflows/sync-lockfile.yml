name: Sync npm lockfile

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - package.json
      - .nvmrc
      - .github/workflows/sync-lockfile.yml

permissions:
  contents: write

concurrency:
  group: credi-marketplace-lockfile
  cancel-in-progress: true

jobs:
  sync:
    name: Regenerate package-lock.json
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          check-latest: true
          package-manager-cache: false

      - name: Verify runtime
        shell: bash
        run: |
          set -euo pipefail

          node --version
          npm --version

          node -e 'const major=Number(process.versions.node.split(".")[0]); if (major !== 24) process.exit(1)'
          node -e 'const major=Number(process.versions.npm.split(".")[0]); if (major !== 11) process.exit(1)'

      - name: Validate package manifest
        shell: bash
        run: |
          set -euo pipefail
          test -f package.json

          node <<'NODE'
          const fs = require("node:fs");
          const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));

          const checks = [
            ["packageManager", pkg.packageManager, "npm@11.19.0"],
            ["engines.node", pkg.engines?.node, ">=24.0.0 <25.0.0"],
            ["engines.npm", pkg.engines?.npm, ">=11.0.0 <12.0.0"],
          ];

          for (const [name, actual, expected] of checks) {
            if (actual !== expected) {
              console.error(`::error::${name} must be ${expected}; found ${actual ?? "missing"}`);
              process.exit(1);
            }
          }
          NODE

      - name: Regenerate package-lock.json
        shell: bash
        run: |
          set -euo pipefail
          rm -f package-lock.json
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Validate regenerated lockfile
        shell: bash
        run: |
          set -euo pipefail
          test -f package-lock.json
          npm ci --dry-run --ignore-scripts --no-audit --no-fund

      - name: Verify resolved dependency tree
        shell: bash
        run: |
          set -euo pipefail
          npm install --ignore-scripts --no-audit --no-fund
          npm ls esbuild postcss sharp vite vitest --depth=10

      - name: Commit synchronized lockfile
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already synchronized."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: regenerate npm lockfile"
          git push
