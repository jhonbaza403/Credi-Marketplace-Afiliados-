name: Sync package-lock.json

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  sync-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Generate package-lock.json
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit lockfile and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet -- package-lock.json; then
            echo "package-lock.json is already synchronized."
          else
            git commit -m "chore: sync package-lock with package.json"
          fi
          git rm .github/workflows/sync-lockfile.yml
          git commit -m "chore: remove temporary lockfile workflow"
          git push
