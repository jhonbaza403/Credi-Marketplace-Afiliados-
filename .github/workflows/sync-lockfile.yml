name: Sync npm lockfile

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - package.json
      - .github/workflows/sync-lockfile.yml

permissions:
  contents: write

concurrency:
  group: credi-marketplace-lockfile
  cancel-in-progress: true

jobs:
  sync:
    name: Regenerate package-lock.json
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify runtime
        shell: bash
        run: |
          set -euo pipefail
          node --version
          npm --version
          node -e 'const major=Number(process.versions.node.split(".")[0]); if (major !== 22) process.exit(1)'
          node -e 'const major=Number(process.versions.npm.split(".")[0]); if (major !== 10) process.exit(1)'

      - name: Rebuild lockfile from package.json
        shell: bash
        run: |
          set -euo pipefail
          rm -f package-lock.json
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Validate regenerated lockfile
        shell: bash
        run: |
          set -euo pipefail
          test -f package-lock.json
          npm ci --ignore-scripts --no-audit --no-fund --dry-run

      - name: Verify resolved security-sensitive packages
        shell: bash
        run: |
          set -euo pipefail
          npm ls --all --json > /tmp/npm-tree.json
          node <<'NODE'
          const fs = require("node:fs");
          const tree = JSON.parse(fs.readFileSync("/tmp/npm-tree.json", "utf8"));
          const seen = new Map();
          function walk(node) {
            if (!node || !node.dependencies) return;
            for (const [name, dep] of Object.entries(node.dependencies)) {
              if (dep?.version) seen.set(`${name}@${dep.version}`, true);
              walk(dep);
            }
          }
          walk(tree);
          const forbidden = [
            /^esbuild@(0\.24\.|0\.23\.|0\.22\.|0\.21\.|0\.20\.)/,
            /^postcss@8\.(?:0|1|2|3|4|5\.(?:[0-1]?[0-9]|2[0-2]))(?:\.|$)/,
            /^sharp@0\.3(?:[0-4])\./,
          ];
          const bad = [...seen.keys()].filter((entry) => forbidden.some((re) => re.test(entry)));
          if (bad.length) {
            console.error("::error::Vulnerable package versions remain in the resolved tree:");
            for (const entry of bad) console.error(` - ${entry}`);
            process.exit(1);
          }
          console.log("Security-sensitive dependency versions are outside the known vulnerable ranges.");
          NODE

      - name: Commit synchronized lockfile
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already synchronized."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: regenerate npm lockfile"
          git push
