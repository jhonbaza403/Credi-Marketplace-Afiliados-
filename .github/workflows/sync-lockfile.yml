name: Sync npm lockfile

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: credi-lock-sync-main
  cancel-in-progress: true

jobs:
  sync:
    if: github.event.head_commit.message != 'chore(ci): sync npm lockfile'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          check-latest: true

      - name: Install exact npm version
        run: npm install --global npm@11.19.1

      - name: Regenerate lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit synchronized lockfile
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already synchronized."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(ci): sync npm lockfile"
          git push
