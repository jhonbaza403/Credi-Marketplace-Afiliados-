name: Sync npm lockfile

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - package.json
      - .github/workflows/sync-lockfile.yml

permissions:
  contents: write

concurrency:
  group: credi-marketplace-lockfile
  cancel-in-progress: true

jobs:
  sync:
    name: Regenerate package-lock.json
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify runtime
        shell: bash
        run: |
          set -euo pipefail
          node --version
          npm --version
          node -e 'const major=Number(process.versions.node.split(".")[0]); if (major !== 22) process.exit(1)'
          npm -e 'const major=Number(process.versions.npm.split(".")[0]); if (major !== 10) process.exit(1)'

      - name: Rebuild lockfile from package.json
        shell: bash
        run: |
          set -euo pipefail
          rm -f package-lock.json
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Validate regenerated lockfile
        shell: bash
        run: |
          set -euo pipefail
          test -f package-lock.json
          npm ci --ignore-scripts --no-audit --no-fund --dry-run

      - name: Commit synchronized lockfile
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already synchronized."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: regenerate npm lockfile"
          git push
