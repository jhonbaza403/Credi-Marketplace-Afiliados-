name: Sync npm lockfile

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - package.json
      - .nvmrc
      - .github/workflows/sync-lockfile.yml

permissions:
  contents: write

concurrency:
  group: credi-marketplace-lockfile
  cancel-in-progress: true

jobs:
  sync:
    name: Regenerate package-lock.json
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          check-latest: true
          package-manager-cache: false

      - name: Install exact npm version
        shell: bash
        run: |
          set -euo pipefail
          npm install --global npm@11.19.1
          hash -r

      - name: Verify runtime
        shell: bash
        run: |
          set -euo pipefail
          node --version
          npm --version
          node -e 'const major=Number(process.versions.node.split(".")[0]); if (major !== 24) process.exit(1)'
          node -e 'const major=Number(process.versions.npm.split(".")[0]); if (major !== 11) process.exit(1)'
          node -e 'const fs=require("node:fs"); const pkg=JSON.parse(fs.readFileSync("package.json","utf8")); if (pkg.packageManager !== "npm@11.19.1") process.exit(1)'

      - name: Regenerate package-lock.json
        shell: bash
        run: |
          set -euo pipefail
          rm -f package-lock.json
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Validate regenerated package-lock.json
        shell: bash
        run: |
          set -euo pipefail
          test -s package-lock.json
          node <<'NODE'
          const fs = require("node:fs");
          const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
          const lock = JSON.parse(fs.readFileSync("package-lock.json", "utf8"));
          if (lock.lockfileVersion !== 3) throw new Error(`Expected lockfileVersion 3, got ${lock.lockfileVersion}`);
          if (lock.name !== pkg.name) throw new Error("package-lock.json name differs from package.json");
          if (lock.version !== pkg.version) throw new Error("package-lock.json version differs from package.json");
          if (!lock.packages || typeof lock.packages !== "object" || !lock.packages[""]) {
            throw new Error("package-lock.json does not contain the npm package tree");
          }
          console.log("package-lock.json structure: OK");
          NODE

          npm ci --dry-run --ignore-scripts --no-audit --no-fund

      - name: Confirm clean npm installation
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund

      - name: Confirm dependency tree
        shell: bash
        run: |
          set -euo pipefail
          npm ls esbuild postcss sharp vite vitest --depth=10

      # Deliberately keeps package-lock regeneration deterministic on main.
      - name: Commit synchronized lockfile
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already synchronized."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: regenerate npm lockfile"
          git push
