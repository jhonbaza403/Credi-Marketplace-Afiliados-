name: Apply definitive CI fixes

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    name: Apply definitive fixes
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Apply TypeScript fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"Expected pattern not found in {path}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1))

          replace(
              "src/app/(public)/cart/page.tsx",
              '{item.currency ?? "USD"} {item.price.toFixed(2)}',
              'USD {item.price.toFixed(2)}',
          )

          replace(
              "src/app/(public)/products/detail/page.tsx",
              'const isAvailable =\n    Boolean(product) &&\n    product.stock > 0;',
              'const isAvailable =\n    product !== null &&\n    product.stock > 0;',
          )

          replace(
              "src/features/recommendation/index.ts",
              'if (product.isactive) {',
              'if (product.isActive) {',
          )
          replace(
              "src/features/recommendation/index.ts",
              'a.product.created_at,',
              'a.product.createdAt ?? "",',
          )
          replace(
              "src/features/recommendation/index.ts",
              'b.product.created_at,',
              'b.product.createdAt ?? "",',
          )
          PY

      - name: Replace LanguageContext with typed compatibility API
        run: |
          cat > src/context/LanguageContext.tsx <<'EOF'
          "use client";

          import {
            createContext,
            useCallback,
            useContext,
            useEffect,
            useMemo,
            useState,
            type ReactNode,
          } from "react";

          import {
            locales,
            defaultLocale,
            isLocale,
            type Locale,
            getLocaleConfig,
            type LocaleConfig,
          } from "@/i18n/config";

          const translations = {
            es: {
              bannerTag: "Credi Marketplace",
              bannerTitle: "Oportunidades seleccionadas para crecer",
              bannerDesc: "Accede a una selección cuidadosamente curada de productos, servicios y plataformas internacionales que complementan el ecosistema de Credi Marketplace.",
              subtitle: "Ecosistema global de comercio y servicios",
              support: "Soporte",
              rights: "Todos los derechos reservados.",
              terms: "Términos y condiciones",
              privacy: "Privacidad",
            },
            en: {
              bannerTag: "Credi Marketplace",
              bannerTitle: "Selected opportunities to grow",
              bannerDesc: "Access a carefully curated selection of products, services and international platforms that complement the Credi Marketplace ecosystem.",
              subtitle: "Global commerce and services ecosystem",
              support: "Support",
              rights: "All rights reserved.",
              terms: "Terms and conditions",
              privacy: "Privacy",
            },
            pt: {
              bannerTag: "Credi Marketplace",
              bannerTitle: "Oportunidades selecionadas para crescer",
              bannerDesc: "Acesse uma seleção cuidadosamente curada de produtos, serviços e plataformas internacionais que complementam o ecossistema Credi Marketplace.",
              subtitle: "Ecossistema global de comércio e serviços",
              support: "Suporte",
              rights: "Todos os direitos reservados.",
              terms: "Termos e condições",
              privacy: "Privacidade",
            },
            fr: {
              bannerTag: "Credi Marketplace",
              bannerTitle: "Opportunités sélectionnées pour grandir",
              bannerDesc: "Accédez à une sélection soigneusement organisée de produits, services et plateformes internationales qui complètent l’écosystème Credi Marketplace.",
              subtitle: "Écosystème mondial de commerce et de services",
              support: "Support",
              rights: "Tous droits réservés.",
              terms: "Conditions générales",
              privacy: "Confidentialité",
            },
          } as const;

          type TranslationKey = keyof typeof translations.es;

          export interface LanguageContextValue {
            locale: Locale;
            lang: Locale;
            localeConfig: LocaleConfig;
            availableLocales: readonly Locale[];
            setLocale(locale: Locale): void;
            changeLanguage(locale: Locale): void;
            t(key: TranslationKey): string;
          }

          export const LanguageContext = createContext<LanguageContextValue | undefined>(undefined);

          const LANGUAGE_STORAGE_KEY = "credi-marketplace-locale";

          export function LanguageProvider({ children }: { children: ReactNode }) {
            const [locale, setLocaleState] = useState<Locale>(defaultLocale);

            useEffect(() => {
              try {
                const stored = localStorage.getItem(LANGUAGE_STORAGE_KEY);
                const nextLocale = stored && isLocale(stored) ? stored : defaultLocale;
                setLocaleState(nextLocale);
                document.documentElement.lang = nextLocale;
              } catch {
                document.documentElement.lang = defaultLocale;
              }
            }, []);

            const setLocale = useCallback((newLocale: Locale) => {
              setLocaleState(newLocale);
              try {
                localStorage.setItem(LANGUAGE_STORAGE_KEY, newLocale);
                document.documentElement.lang = newLocale;
              } catch {
                document.documentElement.lang = newLocale;
              }
            }, []);

            const changeLanguage = useCallback(
              (newLocale: Locale) => setLocale(newLocale),
              [setLocale],
            );

            const localeConfig = useMemo(() => getLocaleConfig(locale), [locale]);
            const t = useCallback(
              (key: TranslationKey) => translations[locale][key] ?? translations.es[key],
              [locale],
            );

            const value = useMemo<LanguageContextValue>(
              () => ({
                locale,
                lang: locale,
                localeConfig,
                availableLocales: locales,
                setLocale,
                changeLanguage,
                t,
              }),
              [locale, localeConfig, setLocale, changeLanguage, t],
            );

            return (
              <LanguageContext.Provider value={value}>
                {children}
              </LanguageContext.Provider>
            );
          }

          export function useLanguage(): LanguageContextValue {
            const context = useContext(LanguageContext);
            if (!context) {
              throw new Error("useLanguage debe utilizarse dentro de LanguageProvider");
            }
            return context;
          }
          EOF

      - name: Replace validation helpers
        run: |
          cat > src/lib/validation.ts <<'EOF'
          const VALIDATION_LIMITS = {
            quantity: { min: 1, max: 10000 },
            rating: { min: 1, max: 5 },
          } as const;

          export function isValidEmail(email: string | undefined | null): boolean {
            if (typeof email !== "string") return false;
            const normalized = email.trim();
            if (!normalized || normalized.length > 254) return false;
            return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(normalized);
          }

          export function isValidQuantity(
            quantity: number | undefined | null,
          ): boolean {
            if (
              typeof quantity !== "number" ||
              !Number.isInteger(quantity)
            ) {
              return false;
            }
            return (
              quantity >= VALIDATION_LIMITS.quantity.min &&
              quantity <= VALIDATION_LIMITS.quantity.max
            );
          }

          export function isValidStock(
            stock: number | undefined | null,
          ): boolean {
            if (
              typeof stock !== "number" ||
              !Number.isInteger(stock)
            ) {
              return false;
            }
            return stock >= 0 && stock <= VALIDATION_LIMITS.quantity.max;
          }

          export function isValidRating(
            rating: number | undefined | null,
          ): boolean {
            if (
              typeof rating !== "number" ||
              !Number.isInteger(rating)
            ) {
              return false;
            }
            return (
              rating >= VALIDATION_LIMITS.rating.min &&
              rating <= VALIDATION_LIMITS.rating.max
            );
          }
          EOF

      - name: Fix typed Supabase profile mapping
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("src/context/AuthContext.tsx")
          text = p.read_text()
          marker = '    const nextProfile: Profile = {'
          insert = '''    type ProfileRow = {\n      id: string;\n      email: string | null;\n      full_name: string | null;\n      avatar_url: string | null;\n      role: UserRole;\n      is_active: boolean | null;\n      created_at: string | null;\n      updated_at: string | null;\n    };\n\n    const row = data as unknown as ProfileRow;\n\n'''
          if marker not in text:
              raise SystemExit("AuthContext profile marker not found")
          text = text.replace(marker, insert + marker, 1)
          replacements = {
              'id: data.id,': 'id: row.id,',
              'email: data.email ?? null,': 'email: row.email ?? null,',
              'fullName: data.full_name ?? null,': 'fullName: row.full_name ?? null,',
              'full_name: data.full_name ?? null,': 'full_name: row.full_name ?? null,',
              'avatarUrl: data.avatar_url ?? null,': 'avatarUrl: row.avatar_url ?? null,',
              'avatar_url: data.avatar_url ?? null,': 'avatar_url: row.avatar_url ?? null,',
              'role: data.role as UserRole,': 'role: row.role,',
              'isActive: data.is_active ?? true,': 'isActive: row.is_active ?? true,',
              'is_active: data.is_active ?? true,': 'is_active: row.is_active ?? true,',
              'createdAt: data.created_at ?? undefined,': 'createdAt: row.created_at ?? undefined,',
              'created_at: data.created_at ?? undefined,': 'created_at: row.created_at ?? undefined,',
              'updatedAt: data.updated_at ?? undefined,': 'updatedAt: row.updated_at ?? undefined,',
              'updated_at: data.updated_at ?? undefined,': 'updated_at: row.updated_at ?? undefined,',
          }
          for old, new in replacements.items():
              text = text.replace(old, new)
          p.write_text(text)
          PY

      - name: Add missing affiliate button labels
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("src/features/affiliate/data/products.ts")
          text = p.read_text()
          old1 = "  affiliateUrl:\n  'https://amzn.to/4bJJq22',\n"
          new1 = old1 + "\n  buttonText:{\n    es:'Ver producto',\n    en:'View product',\n    pt:'Ver produto',\n    fr:'Voir le produit',\n  },\n"
          old2 = "  affiliateUrl:\n  'https://onelink.shein.com/44/5wyleaujbj2iI',\n"
          new2 = old2 + "\n  buttonText:{\n    es:'Ver producto',\n    en:'View product',\n    pt:'Ver produto',\n    fr:'Voir le produit',\n  },\n"
          if old1 not in text or old2 not in text:
              raise SystemExit("Affiliate URL anchors not found")
          text = text.replace(old1, new1, 1)
          text = text.replace(old2, new2, 1)
          p.write_text(text)
          PY

      - name: Pin Vite for Vitest compatibility
        run: |
          node - <<'JS'
          const fs = require('fs');
          const file = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(file, 'utf8'));
          pkg.devDependencies = pkg.devDependencies || {};
          pkg.devDependencies.vite = '6.4.3';
          pkg.overrides = {
            ...(pkg.overrides || {}),
            esbuild: '^0.25.12',
            sharp: '^0.35.4',
            vitest: { vite: '6.4.3' }
          };
          fs.writeFileSync(file, JSON.stringify(pkg, null, 2) + '\n');
          JS
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Validate
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run lint
          npm run typecheck
          npm ls vite esbuild postcss sharp vitest --depth=10

      - name: Commit fixes and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json src
          git rm .github/workflows/fix-current-ci.yml
          git commit -m "fix: resolve typecheck and dependency security issues"
          git push
