name: Credi LIVE Preview E2E

on:
  workflow_dispatch:
    inputs:
      preview_url:
        description: "URL única del deployment Vercel Preview (no producción)"
        required: true
        type: string
      live_room_id:
        description: "ID no secreto de la sala LIVE que ya completó emisión y reconexión"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: credi-live-preview-e2e-${{ inputs.live_room_id }}
  cancel-in-progress: false

jobs:
  live-preview-e2e:
    name: Real RTMPS/SRT + webhooks + two viewers + replay
    runs-on: ubuntu-latest
    timeout-minutes: 35

    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      NODE_ENV: test
      PLAYWRIGHT_BASE_URL: ${{ inputs.preview_url }}
      E2E_LIVE_ROOM_ID: ${{ inputs.live_room_id }}
      E2E_STORAGE_STATE_PATH: /tmp/credi-live-preview-storage-state.json
      CREDI_LIVE_RELEASE_E2E: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate Preview target and authenticated owner session
        shell: bash
        env:
          E2E_STORAGE_STATE_JSON: ${{ secrets.E2E_STORAGE_STATE_JSON }}
        run: |
          set -euo pipefail
          test -n "${PLAYWRIGHT_BASE_URL}" || { echo "::error::Missing Preview URL input"; exit 1; }
          test -n "${E2E_LIVE_ROOM_ID}" || { echo "::error::Missing LIVE room ID input"; exit 1; }
          test -n "${E2E_STORAGE_STATE_JSON}" || { echo "::error::Missing E2E_STORAGE_STATE_JSON secret"; exit 1; }

          node <<'NODE'
          const url = new URL(process.env.PLAYWRIGHT_BASE_URL);
          const productionHost = "credi-marketplace-afiliados.vercel.app";
          if (url.protocol !== "https:") throw new Error("The LIVE release target must use HTTPS");
          if (url.hostname === productionHost) throw new Error("Production is not an allowed target for this Preview-only workflow");
          if (!/^credi-marketplace-afiliados-.+\.vercel\.app$/.test(url.hostname)) {
            throw new Error("The target must be a unique Credi Vercel Preview deployment URL");
          }
          if (!/^[0-9a-f]{8}-[0-9a-f-]{27,}$/i.test(process.env.E2E_LIVE_ROOM_ID)) {
            throw new Error("LIVE room ID must be a UUID");
          }
          const state = JSON.parse(process.env.E2E_STORAGE_STATE_JSON);
          if (!Array.isArray(state.cookies) || !Array.isArray(state.origins)) {
            throw new Error("E2E storage state is not a Playwright storage-state document");
          }
          console.log("Preview target shape and owner storage-state structure validated; values withheld.");
          NODE

          umask 077
          printf '%s' "${E2E_STORAGE_STATE_JSON}" > "${E2E_STORAGE_STATE_PATH}"
          chmod 600 "${E2E_STORAGE_STATE_PATH}"
          unset E2E_STORAGE_STATE_JSON

      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install exact npm version
        run: |
          npm install --global npm@11.19.1
          hash -r

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run real Preview LIVE release verification
        run: npx playwright test tests/e2e/live-release.spec.ts --reporter=line

      - name: Upload sanitized LIVE evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: credi-live-preview-evidence-${{ github.run_id }}
          path: test-results/live-release-evidence.json
          if-no-files-found: warn
          retention-days: 14

      - name: Remove temporary authenticated browser state
        if: always()
        shell: bash
        run: rm -f "${E2E_STORAGE_STATE_PATH}"
