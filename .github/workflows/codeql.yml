name: Credi CodeQL SAST
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    - cron: "31 4 * * 1"
permissions:
  contents: read
  security-events: write
  actions: read
jobs:
  analyze:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality
      - name: Autobuild
        uses: github/codeql-action/autobuild@v4
      - name: Analyze
        id: analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
          output: codeql-results
          post-processed-sarif-path: codeql-postprocessed
      - name: Summarize SARIF findings and data flows
        if: always()
        run: node scripts/inspect-codeql-sarif.mjs codeql-postprocessed
      - name: Archive SARIF for auditable review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codeql-sarif-${{ matrix.language }}
          path: codeql-postprocessed/
          if-no-files-found: error
          retention-days: 7
