name: Credi Marketplace Security

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  group: credi-marketplace-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  NODE_ENV: test

jobs:
  audit:
    name: Security & Vulnerability Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          check-latest: true
          package-manager-cache: false

      - name: Verify Node.js and npm
        shell: bash
        run: |
          set -euo pipefail

          NODE_VERSION="$(node --version)"
          NPM_VERSION="$(npm --version)"
          NODE_MAJOR="$(node -p "process.versions.node.split('.')[0]")"
          NPM_MAJOR="$(npm --version | cut -d. -f1)"

          echo "Node.js: ${NODE_VERSION}"
          echo "npm:     ${NPM_VERSION}"

          if [ "${NODE_MAJOR}" != "24" ]; then
            echo "::error::Expected Node.js 24.x but found ${NODE_VERSION}"
            exit 1
          fi

          if [ "${NPM_MAJOR}" != "11" ]; then
            echo "::error::Expected npm 11.x but found ${NPM_VERSION}"
            exit 1
          fi

      - name: Validate package-lock.json
        shell: bash
        run: |
          set -euo pipefail
          test -f package-lock.json
          npm ci --dry-run --ignore-scripts --no-audit --no-fund

      - name: Install dependencies from lockfile
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify critical dependency tree
        run: |
          npm ls esbuild postcss sharp vite vitest --depth=10

      - name: Run Security Audit
        run: npm audit --audit-level=high

      - name: Security audit passed
        if: success()
        shell: bash
        run: |
          echo "Credi Marketplace Security: PASSED"
          echo "Node.js: $(node --version)"
          echo "npm:     $(npm --version)"
