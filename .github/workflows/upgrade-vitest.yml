name: One-time Vitest security upgrade

on:
  push:
    branches: [vercel-ready]

permissions:
  contents: write

jobs:
  upgrade:
    if: github.actor == 'jhonbaza403'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: true
      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install npm 11.19.1
        run: npm install --global npm@11.19.1
      - name: Upgrade Vitest security patch
        run: npm install --save-dev --save-exact vitest@4.1.11
      - name: Commit lockfile update
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "No lockfile changes required."
            exit 0
          fi
          git config user.name "Credi Security Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "security: upgrade vitest to 4.1.11"
          git push
