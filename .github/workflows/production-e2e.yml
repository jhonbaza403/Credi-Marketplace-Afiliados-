name: Credi Production E2E

on:
  workflow_dispatch:
  schedule:
    # Read-only operational verification; dedicated test account, operation and LIVE room.
    - cron: "23 6 * * *"
  deployment_status:

permissions:
  contents: read

env:
  CI: "true"
  NEXT_TELEMETRY_DISABLED: "1"
  NODE_ENV: test
  PLAYWRIGHT_BASE_URL: ${{ secrets.E2E_BASE_URL }}
  E2E_STORAGE_STATE_PATH: /tmp/credi-e2e-storage-state.json
  E2E_OPERATION_ID: ${{ secrets.E2E_OPERATION_ID }}
  E2E_LIVE_ROOM_ID: ${{ secrets.E2E_LIVE_ROOM_ID }}

jobs:
  production-e2e:
    name: Read-only Production smoke test — financial trace + LIVE replay
    if: >-
      github.event_name != 'deployment_status' ||
      (github.event.deployment_status.state == 'success' &&
       github.event.deployment.environment == 'Production')
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout deployed commit (or scheduled/manual default ref)
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.deployment.sha || github.sha }}

      - name: Validate required production E2E secrets
        shell: bash
        env:
          E2E_STORAGE_STATE_JSON: ${{ secrets.E2E_STORAGE_STATE_JSON }}
        run: |
          set -euo pipefail
          test -n "${PLAYWRIGHT_BASE_URL}" || { echo "::error::Missing E2E_BASE_URL"; exit 1; }
          test -n "${E2E_OPERATION_ID}" || { echo "::error::Missing E2E_OPERATION_ID"; exit 1; }
          test -n "${E2E_LIVE_ROOM_ID}" || { echo "::error::Missing E2E_LIVE_ROOM_ID"; exit 1; }
          test -n "${E2E_STORAGE_STATE_JSON}" || { echo "::error::Missing E2E_STORAGE_STATE_JSON"; exit 1; }
          printf '%s' "${E2E_STORAGE_STATE_JSON}" > "${E2E_STORAGE_STATE_PATH}"
          node -e "JSON.parse(require('fs').readFileSync(process.env.E2E_STORAGE_STATE_PATH, 'utf8'));"

      - name: Setup Node 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install npm
        run: npm install --global npm@11.19.1

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      # This suite is intentionally GET-only: it must not create orders, move
      # balances, trigger Stripe payments/refunds, upload files, or open LIVE rooms.
      # E2E_OPERATION_ID and E2E_LIVE_ROOM_ID must identify dedicated test fixtures.
      - name: Run read-only production smoke test
        run: npx playwright test tests/e2e/production-journey.spec.ts --reporter=line
      - name: Remove temporary authentication state
        if: always()
        run: rm -f "${E2E_STORAGE_STATE_PATH}"
