name: Credi Production Smoke Test

on:
  workflow_dispatch:
  schedule:
    # Daily read-only check of the deployed public surface.
    - cron: "23 6 * * *"
  deployment_status:

permissions:
  contents: read

env:
  CI: "true"
  NEXT_TELEMETRY_DISABLED: "1"
  NODE_ENV: test
  PLAYWRIGHT_BASE_URL: ${{ secrets.E2E_BASE_URL }}

jobs:
  production-smoke:
    name: Read-only Production smoke test — public routes + health
    if: >-
      github.event_name != 'deployment_status' ||
      (github.event.deployment_status.state == 'success' &&
       (github.event.deployment.environment == 'Production' ||
        github.event.deployment.environment == 'production'))
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout deployed commit (or scheduled/manual default ref)
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.deployment.sha || github.sha }}

      - name: Validate Production smoke target
        shell: bash
        run: |
          set -euo pipefail
          test -n "${PLAYWRIGHT_BASE_URL}" || {
            echo "::error::Missing E2E_BASE_URL secret; refusing to run against an inferred URL."
            exit 1
          }

      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install pinned npm
        run: npm install --global npm@11.19.1

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # Public-route and health checks use GET only. This workflow must never
      # create orders, charge/refund money, alter balances, upload media or open LIVE rooms.
      - name: Run read-only Production smoke tests
        run: npx playwright test tests/e2e/public-routes.spec.ts --reporter=line
