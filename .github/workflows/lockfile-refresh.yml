name: Refresh npm lockfile

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  refresh:
    name: Refresh package-lock.json
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify Node.js and npm
        run: |
          echo "Node: $(node --version)"
          echo "npm:  $(npm --version)"
          node -e "const major=Number(process.versions.node.split('.')[0]); if (major !== 22) { console.error('Expected Node.js 22.x'); process.exit(1); }"

      - name: Refresh lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet -- package-lock.json; then
            echo "package-lock.json is already synchronized."
            exit 0
          fi
          git commit -m "chore: synchronize package-lock"
          git push
