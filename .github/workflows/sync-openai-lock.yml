name: Sync OpenAI lockfile

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install exact npm
        run: npm install --global npm@11.19.1

      - name: Regenerate lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit synced lockfile and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/sync-openai-lock.yml
          git add package-lock.json .github/workflows/sync-openai-lock.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: sync OpenAI dependency lockfile"
          git push
