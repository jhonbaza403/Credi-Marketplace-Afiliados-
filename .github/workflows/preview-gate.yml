name: Credi Marketplace Preview Gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  statuses: read

concurrency:
  group: preview-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  vercel-preview:
    name: Validate Vercel Preview
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Wait for Vercel Preview status
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail

          BRANCH_FILTER="$(jq -rn --arg branch "${GITHUB_HEAD_REF:-}" '$branch | @uri')"
          # In pull_request workflows, derive the source branch from the event payload.
          BRANCH_NAME="$(gh api -H 'Accept: application/vnd.github+json' "/repos/${REPOSITORY}/pulls/${{ github.event.pull_request.number }}" --jq '.head.ref')"
          BRANCH_FILTER="$(jq -rn --arg branch "${BRANCH_NAME}" '$branch | @uri')"

          for attempt in $(seq 1 24); do
            STATUS_JSON="$(gh api -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "/repos/${REPOSITORY}/commits/${COMMIT_SHA}/status")"

            # Match the canonical Vercel project status for this exact PR branch and commit.
            VERCEL_STATUS="$(printf '%s' "${STATUS_JSON}" | jq -c --arg context "Vercel Deployments – credi-marketplace-afiliados" --arg branch "${BRANCH_FILTER}" --arg sha "${COMMIT_SHA}" '[.statuses[] | select(.context == $context) | select((.target_url // "") | contains("filterBranch=" + $branch)) | select((.target_url // "") | contains($sha))] | first // {}')"
            STATE="$(printf '%s' "${VERCEL_STATUS}" | jq -r '.state // ""')"
            TARGET="$(printf '%s' "${VERCEL_STATUS}" | jq -r '.target_url // ""')"

            echo "Vercel Preview context: Vercel Deployments – credi-marketplace-afiliados"
            echo "Source branch: ${BRANCH_NAME}"
            echo "Commit: ${COMMIT_SHA}"
            echo "State (attempt ${attempt}/24): ${STATE:-pending}"
            echo "Target: ${TARGET:-missing}"

            case "${STATE}" in
              success)
                echo "Vercel Preview validation: PASSED"
                exit 0
                ;;
              failure|error)
                echo "::error::Vercel Preview failed for this branch and commit."
                exit 1
                ;;
            esac

            sleep 10
          done

          echo "::error::Vercel Preview did not reach success within 4 minutes."
          exit 1
