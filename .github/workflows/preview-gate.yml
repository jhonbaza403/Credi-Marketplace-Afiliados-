name: Credi Marketplace Cloudflare Preview Gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: cloudflare-preview-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CI: "true"
  NEXT_TELEMETRY_DISABLED: "1"
  NODE_ENV: test
  NEXT_PUBLIC_APP_URL: https://credi-marketplace-afiliados.bazajhon.workers.dev
  NEXT_PUBLIC_SITE_URL: https://credi-marketplace-afiliados.bazajhon.workers.dev
  NEXT_PUBLIC_APP_NAME: Credi Marketplace
  NEXT_PUBLIC_DEFAULT_LOCALE: es
  NEXT_PUBLIC_DEFAULT_CURRENCY: USD
  NEXT_PUBLIC_DEFAULT_COUNTRY: VE
  NEXT_PUBLIC_ENV: production
  NEXT_PUBLIC_SUPABASE_URL: https://fusnmvmveqdzmzohhlzm.supabase.co
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_68VV9wzImMYuu7cnrfLpzg_zYCL_OLV

jobs:
  cloudflare-preview-build:
    name: Validate Cloudflare Workers build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout reviewed pull request
        uses: actions/checkout@v6
      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install pinned npm
        run: |
          set -euo pipefail
          npm install --global npm@11.19.1
          test "$(npm --version)" = "11.19.1"
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate Cloudflare adapter compatibility
        run: npx opennextjs-cloudflare build
      - name: Validate Worker bundle without publishing it
        run: npx wrangler deploy --dry-run
      - name: Report preview readiness
        if: success()
        run: echo "Cloudflare build and Wrangler dry-run passed. This job does not publish a deployment."
