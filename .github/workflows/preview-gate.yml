name: Credi Marketplace Preview Gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  statuses: read
  checks: read

concurrency:
  group: preview-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  vercel-preview:
    name: Validate Vercel Preview
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Wait for Vercel Preview status
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail

          for attempt in $(seq 1 24); do
            STATUS_JSON="$(gh api -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2026-03-10' "/repos/${REPOSITORY}/commits/${COMMIT_SHA}/status")"
            # Provider-family contract: ascii_downcase | startswith("vercel").
            # Accept only the canonical Vercel context, not the separate
            # "Vercel Deployments – ..." summary that can succeed without a Preview.
            VERCEL_STATUS="$(printf '%s' "${STATUS_JSON}" | jq -c --arg canonical_context "Vercel – credi-marketplace-afiliados" '[.statuses[] | select((((.context // "") | ascii_downcase) == ($canonical_context | ascii_downcase)) or (((.context // "") | ascii_downcase) == "vercel"))] | first // {}')"
            STATE="$(printf '%s' "${VERCEL_STATUS}" | jq -r '.state // ""')"
            TARGET="$(printf '%s' "${VERCEL_STATUS}" | jq -r '.target_url // ""')"
            DESCRIPTION="$(printf '%s' "${VERCEL_STATUS}" | jq -r '.description // ""')"

            # Vercel can publish a Check Run instead of a legacy commit status.
            if [ -z "${STATE}" ] || [ "${STATE}" = "pending" ]; then
              CHECK_RUNS="$(gh api -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2026-03-10' "/repos/${REPOSITORY}/commits/${COMMIT_SHA}/check-runs")"
              VERCEL_CHECK="$(printf '%s' "${CHECK_RUNS}" | jq -c '[.check_runs[] | select((((.app.slug // "") | ascii_downcase) | contains("vercel")) and (((.app.slug // "") | ascii_downcase) != "github-actions"))] | sort_by(.completed_at // .started_at // "") | last // {}')"
              CHECK_STATUS="$(printf '%s' "${VERCEL_CHECK}" | jq -r '.status // ""')"
              CHECK_CONCLUSION="$(printf '%s' "${VERCEL_CHECK}" | jq -r '.conclusion // ""')"
              CHECK_URL="$(printf '%s' "${VERCEL_CHECK}" | jq -r '.html_url // ""')"
              CHECK_NAME="$(printf '%s' "${VERCEL_CHECK}" | jq -r '.name // ""')"

              if [ "${CHECK_STATUS}" = "completed" ] && [ -n "${CHECK_CONCLUSION}" ]; then
                STATE="${CHECK_CONCLUSION}"
                TARGET="${CHECK_URL}"
                DESCRIPTION="${CHECK_NAME}: ${CHECK_CONCLUSION}"
              elif [ -n "${CHECK_STATUS}" ]; then
                STATE="pending"
                TARGET="${CHECK_URL}"
                DESCRIPTION="${CHECK_NAME}: ${CHECK_STATUS}"
              fi
            fi

            echo "Vercel Preview: ${STATE:-pending}"
            echo "Details: ${DESCRIPTION:-pending}"
            echo "Target: ${TARGET:-pending}"

            case "${STATE}" in
              success)
                echo "Vercel Preview validation: PASSED"
                exit 0
                ;;
              failure|error)
                if printf '%s %s' "${DESCRIPTION}" "${TARGET}" | grep -Eqi 'rate.?limit|retry in 24 hours|build-rate-limit'; then
                  echo "::error::Vercel deployment build limit reached. GitHub Actions cannot clear this provider-side deployment build limit. Retry when Vercel permits another build; this is not a successful Preview."
                  echo "Vercel deployment limits: https://vercel.com/credi-marketplace-afiliados?upgradeToPro=build-rate-limit"
                else
                  echo "::error::Vercel Preview failed: ${DESCRIPTION:-no provider details returned}."
                fi
                exit 1
                ;;
            esac

            sleep 10
          done

          echo "::error::Vercel Preview did not reach success within 4 minutes."
          exit 1
