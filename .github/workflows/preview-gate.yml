name: Credi Marketplace Preview Gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  statuses: read

concurrency:
  group: preview-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  vercel-preview:
    name: Validate Vercel Preview
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Wait for Vercel Preview status
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail

          for attempt in $(seq 1 24); do
            STATUS_JSON="$(gh api -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2026-03-10' "/repos/${REPOSITORY}/commits/${COMMIT_SHA}/status")"
            VERCEL_STATUS="$(printf '%s' "${STATUS_JSON}" | jq -c '[.statuses[] | select(.context == "Vercel" or (((.context // "") | startswith("Vercel – credi-marketplace-afiliados")) and (((.context // "") | contains("uwhm")) | not)))] | first // {}')"
            STATE="$(printf '%s' "${VERCEL_STATUS}" | jq -r '.state // ""')"
            TARGET="$(printf '%s' "${VERCEL_STATUS}" | jq -r '.target_url // ""')"

            echo "Vercel Preview: ${STATE:-pending}"
            echo "Target: ${TARGET:-pending}"

            case "${STATE}" in
              success)
                echo "Vercel Preview validation: PASSED"
                exit 0
                ;;
              failure|error)
                echo "::error::Vercel Preview failed."
                exit 1
                ;;
            esac

            sleep 10
          done

          echo "::error::Vercel Preview did not reach success within 4 minutes."
          exit 1
