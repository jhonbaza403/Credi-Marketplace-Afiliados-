name: Credi Marketplace Preview Gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  statuses: read

concurrency:
  group: preview-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  vercel-preview:
    name: Validate Vercel Preview
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Wait for Vercel Preview status
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail

          for attempt in $(seq 1 24); do
            STATUS_JSON="$(gh api -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2026-03-10' "/repos/${REPOSITORY}/commits/${COMMIT_SHA}/status")"
            # Only inspect the deployment status named exactly "Vercel".
            # "Vercel Deployments – ..." may say "No required projects to validate";
            # that is not proof that a Preview deployment was built successfully.
            VERCEL_STATUS="$(printf '%s' "${STATUS_JSON}" | jq -c '[.statuses[] | select((.context // "") == "Vercel")] | last // {}')"
            STATE="$(printf '%s' "${VERCEL_STATUS}" | jq -r '.state // ""')"
            TARGET="$(printf '%s' "${VERCEL_STATUS}" | jq -r '.target_url // ""')"
            DESCRIPTION="$(printf '%s' "${VERCEL_STATUS}" | jq -r '.description // ""')"

            echo "Vercel deployment status: ${STATE:-pending}"
            echo "Description: ${DESCRIPTION:-pending}"
            echo "Target: ${TARGET:-pending}"

            case "${STATE}" in
              success)
                echo "Vercel Preview status check: PASSED"
                exit 0
                ;;
              failure|error)
                if printf '%s' "${TARGET} ${DESCRIPTION}" | grep -Eqi 'build-rate-limit|rate.?limit|retry in 24 hours'; then
                  echo "::error::Vercel Preview is blocked by the provider deployment rate limit. This is not a successful Preview; retry when Vercel permits another build."
                else
                  echo "::error::Vercel reported a failed deployment. Inspect the target URL for the deployment failure."
                fi
                exit 1
                ;;
            esac

            sleep 10
          done

          echo "::error::Vercel Preview did not reach success within 4 minutes."
          exit 1
