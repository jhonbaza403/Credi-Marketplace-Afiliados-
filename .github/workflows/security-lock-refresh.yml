name: Refresh lockfile and audit

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  security:
    name: Refresh package-lock and run security audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Refresh package-lock.json
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Verify security audit
        run: npm audit --audit-level=high

      - name: Commit refreshed lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet -- package-lock.json; then
            echo "package-lock.json is already synchronized."
          else
            git commit -m "chore: refresh package-lock after security updates"
            git push
          fi
