name: Credi Marketplace iOS

on:
  workflow_dispatch:
  push:
    branches: [main, develop, audit-hardening-2026-09-13]
    paths:
      - 'capacitor.config.ts'
      - 'mobile/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ios-capacitor.yml'

permissions:
  contents: read

env:
  CI: true
  NODE_ENV: production
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  ios:
    name: Build iOS simulator package
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Synchronize lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate bootstrap
        run: test -f mobile/index.html

      - name: Generate native iOS project
        run: |
          rm -rf ios
          npx cap add ios
          npx cap sync ios

      - name: Build iOS simulator target
        working-directory: ios
        run: |
          xcodebuild \
            -workspace App/App.xcworkspace \
            -scheme App \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
