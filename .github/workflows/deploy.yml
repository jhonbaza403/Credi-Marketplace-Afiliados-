name: Credi Marketplace Cloudflare Deployment Gate

on:
  workflow_run:
    workflows:
      - "Credi Marketplace CI"
    branches:
      - main
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: credi-marketplace-cloudflare-gate-main
  cancel-in-progress: true

jobs:
  smoke-test-cloudflare:
    name: Verify deployed Cloudflare Worker health
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      HEALTH_URL: https://credi-marketplace.bazajhon.workers.dev/api/health
      CI_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Wait for Cloudflare deployment and verify application health
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            response="$(curl --silent --show-error --max-time 15 --output /tmp/credi-health.json --write-out '%{http_code}' "$HEALTH_URL" || true)"
            echo "Health attempt ${attempt}/24 returned HTTP ${response:-none}"
            if [ "$response" = "200" ] && jq -e '.status == "ok" and .service == "credi-marketplace"' /tmp/credi-health.json >/dev/null; then
              echo "Cloudflare deployment health passed."
              exit 0
            fi
            if [ -s /tmp/credi-health.json ]; then
              jq '{status,service,checks,databaseError}' /tmp/credi-health.json || true
            fi
            sleep 15
          done
          echo "::error::Cloudflare Worker did not report healthy status. Verify Workers Builds linkage and runtime secrets for Supabase, then rerun the health check."
          exit 1
      - name: Record deployment verification
        if: success()
        run: |
          {
            echo "## Credi Marketplace Cloudflare Deployment Gate"
            echo ""
            echo "- CI commit: `$CI_SHA`"
            echo "- Health endpoint: `$HEALTH_URL`"
            echo "- Result: healthy"
          } >> "$GITHUB_STEP_SUMMARY"
