name: Credi Marketplace Deployment Gate

on:
  workflow_run:
    workflows: ["Credi Marketplace CI"]
    branches: [main]
    types: [completed]

permissions:
  contents: read
  deployments: write

jobs:
  deployment-gate:
    name: Validate CI & Authorize Deployment
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Verify CI Run Details
        run: |
          echo "CI Workflow: ${{ github.event.workflow_run.name }}"
          echo "Branch: ${{ github.event.workflow_run.head_branch }}"
          echo "Commit SHA: ${{ github.event.workflow_run.head_sha }}"
          echo "CI Status: ${{ github.event.workflow_run.conclusion }}"

      - name: Approve Deployment Gate
        run: |
          echo "CI check passed successfully on main branch."
          echo "Gate status: APPROVED"
