version: 2

updates:
  # ============================================================
  # npm dependencies
  # ============================================================
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "04:17"
      timezone: "UTC"

    open-pull-requests-limit: 10
    versioning-strategy: increase

    groups:
      production-dependencies:
        dependency-type: production
        update-types:
          - minor
          - patch

      development-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch

  # ============================================================
  # GitHub Actions dependencies
  # ============================================================
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "04:37"
      timezone: "UTC"

    open-pull-requests-limit: 10

    groups:
      github-actions:
        patterns:
          - "*"
